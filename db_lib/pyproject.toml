[project]
name = "setoolkit-db"
version = "0.1"
description = "Database import helpers for SE Toolkit"

requires-python = ">= 3.9"
dependencies = [
    "duckdb~=1.1.3",
    "boto3~=1.15.18",
    "pandas~=2.2.3",
    "chardet~=5.2.0",
    "pyarrow~=18.1.0",
]

[project.optional-dependencies]
spark = [
    "pyspark~=3.5.0",
]
build = [
    "ipython~=8.26.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["db"]
